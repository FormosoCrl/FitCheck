# FitCheck — ajustes de Gradle.
# Los ajustes configurados desde el IDE tienen prioridad sobre este archivo.

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache: activarlo cuando estén los 11 módulos y la compilación empiece
# a doler. Algunos procesadores de anotaciones dan guerra, así que mejor con el proyecto
# estable, no ahora.
# org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Proyecto en Java. Si algún día aparece aquí 'kotlin.code.style', alguien se ha
# desviado del plan.

# Room exportará el esquema para versionar las migraciones. Se configura por módulo:
#   javaCompileOptions {
#       annotationProcessorOptions {
#           arguments += ["room.schemaLocation": "$projectDir/schemas"]
#       }
#   }
