pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex 'com\\.android.*'
                includeGroupByRegex 'com\\.google.*'
                includeGroupByRegex 'androidx.*'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'FitCheck'

// Reglas de dependencia (ARCHITECTURE.md §3):
//   · :feature:* no ve :core:database ni :core:network. Pasa por :core:data.
//   · Ningún :feature:* depende de otro; los une :app.
//   · :core:model no depende de nada.

include ':core:model'          // java-library
include ':core:common'         // java-library
include ':core:designsystem'
